# Include the cache zone file from the http {} context before using these locations.
# Include the following location blocks inside the Beanance HTTPS server {} block.
# REST is proxied through Next.js so the existing /market-api rewrite remains the source of truth.
location ^~ /market-api/ {
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_cache beanance_market;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme|$request_method|$host|$request_uri";
    proxy_cache_valid 200 2s;
    proxy_cache_valid 404 1s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_cache_bypass $http_authorization;
    proxy_no_cache $http_authorization;
    add_header X-Beanance-Cache $upstream_cache_status always;
}

# Health check is deliberately uncached and lightweight.
location = /api/health {
    proxy_pass http://127.0.0.1:3099/api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

# Content-hashed Next.js assets can be cached for one year.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache beanance_market;
    proxy_cache_valid 200 365d;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Public images, icons, and fonts use a shorter cache because names are not always hashed.
location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}

# Keep the market backend private; browser clients use the same-origin WebSocket URL.
location /ws/market {
    proxy_pass http://127.0.0.1:3030/ws/market;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
