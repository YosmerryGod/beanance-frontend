# [ADDED] Include this location block inside the existing HTTPS server block for Beanance frontend.
# The market backend remains private on 127.0.0.1:3030.
location /ws/market {
    proxy_pass http://127.0.0.1:3030/ws/market;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
