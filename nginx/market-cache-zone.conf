# Include this file from the Nginx http {} context.
proxy_cache_path /var/cache/nginx/milion_market
    levels=1:2
    keys_zone=milion_market:10m
    max_size=100m
    inactive=10m
    use_temp_path=off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;
