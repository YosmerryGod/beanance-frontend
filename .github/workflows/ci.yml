name: MILION Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milion-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run check:i18n

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload diagnostic logs when a step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: milion-ci-diagnostics-${{ github.run_id }}
          path: |
            ~/.npm/_logs/*.log
            .next/trace
          if-no-files-found: ignore
          retention-days: 7
