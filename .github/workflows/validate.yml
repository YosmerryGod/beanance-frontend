name: Validate Beanance Frontend

on:
  push:
    branches:
      - "refactor/**"
      - "fix/**"
    paths-ignore:
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "package-lock.json"

concurrency:
  group: beanance-frontend-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
            echo "lock_created=false" >> "$GITHUB_OUTPUT"
          else
            npm install --no-audit --no-fund
            echo "lock_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated dependency lockfile on refactor branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/') && steps.install.outputs.lock_created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate translations
        run: npm run check:i18n

      - name: Check deployment scripts
        run: node --check deploy.js && node --check ecosystem.config.cjs && node --check start-current.js && node --check scripts/check-translations.js

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Smoke test standalone health endpoint
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/
          if [ -d public ]; then
            cp -a public .next/standalone/
          fi
          PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/beanance-standalone-smoke.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health -o /tmp/beanance-health.json; then
              break
            fi
            sleep 1
          done
          node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync("/tmp/beanance-health.json", "utf8")); if (!data.success || data.service !== "beanance-frontend") { throw new Error("Standalone health response is invalid: " + JSON.stringify(data)); }'
          cat /tmp/beanance-health.json
