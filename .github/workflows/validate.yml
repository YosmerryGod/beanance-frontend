name: Validate Beanance Frontend

on:
  push:
    branches:
      - "refactor/**"
    paths-ignore:
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "package-lock.json"

concurrency:
  group: beanance-frontend-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Commit generated dependency lockfile on refactor branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/') && !hashFiles('package-lock.json')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate translations
        run: npm run check:i18n

      - name: Check deployment scripts
        run: node --check deploy.js && node --check ecosystem.config.cjs && node --check scripts/check-translations.js

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production
