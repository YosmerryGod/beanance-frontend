name: Validate Beanance Frontend

on:
  push:
    branches:
      - "refactor/**"
  pull_request:
    branches:
      - main

concurrency:
  group: beanance-frontend-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate translations
        run: npm run check:i18n

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production
