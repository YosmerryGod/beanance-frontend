name: Deploy Beanance to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beanance-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd /var/www/beanance-frontend
            git pull --ff-only origin main
            npm install --no-package-lock
            npm run build
            PORT=3012 pm2 restart beanance-frontend --update-env
            pm2 save
