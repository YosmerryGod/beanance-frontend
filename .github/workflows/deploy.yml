name: Deploy Beanance to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beanance-vps-deploy
  cancel-in-progress: false # [MODIFIED] Never cancel a build midway through writing .next.

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Beanance
        shell: bash
        run: |
          set -e
          cd /var/www/beanance-frontend
          git pull --ff-only origin main
          npm install --no-package-lock
          npm run build
          # [ADDED] Do not restart PM2 unless Next.js produced a complete production build.
          test -s .next/BUILD_ID
          if pm2 describe beanance-frontend >/dev/null 2>&1; then
            PORT=3099 pm2 restart beanance-frontend --update-env # [MODIFIED] Use the confirmed production port.
          else
            PORT=3099 pm2 start npm --name beanance-frontend -- start # [MODIFIED] Use the confirmed production port.
          fi
          pm2 delete beanance-test || true
          pm2 save
