name: Deploy Beanance to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beanance-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Beanance
        shell: bash
        run: |
          set -e
          cd /var/www/beanance-frontend
          git pull --ff-only origin main
          npm install --no-package-lock
          npm run build
          if pm2 describe beanance-frontend >/dev/null 2>&1; then
            PORT=3012 pm2 restart beanance-frontend --update-env
          else
            PORT=3012 pm2 start npm --name beanance-frontend -- start
          fi
          pm2 delete beanance-test || true
          pm2 save
