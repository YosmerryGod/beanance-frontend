name: Deploy Beanance Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beanance-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, build, and restart on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            cd /var/www/beanance-frontend
            node deploy.js
